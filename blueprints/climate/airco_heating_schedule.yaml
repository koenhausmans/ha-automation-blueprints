# Airco heating schedule — weekly comfort heating with optional presence (HA automation blueprint)
# Copyright (c) 2026 Koen Hausmans — MIT License
# Source: https://github.com/koenhausmans/ha-automation-blueprints
blueprint:
  name: Airco heating – weekly schedule with optional presence
  description: >
    Heats with an airconditioner (built for the Haier hOn integration, but uses
    only standard climate actions) on a weekly timetable kept in a Schedule
    helper. Each schedule block carries a profile in its additional data
    (`profile: morning`, `profile: daytime` or `profile: evening`) that selects
    its setpoint and start threshold. A block can override these with its own
    `temperature` and `threshold`.

    A block only starts heating while the room sensor is below the block's
    threshold; once heating, the airco's own thermostat takes over until the
    block ends. A block with `presence_only: true` only heats while someone is
    home. Turning the airco off by hand during a block lasts until the block
    ends.

    Presence never starts heating outside a block. It only extends heating that a
    block started: when the block ends while someone is home (and within the
    optional time window), the airco keeps heating at the block's setpoint until
    everyone has been away for the grace period.

    A manual temperature change lasts until the next schedule transition. The
    automation never touches the airco while it is in a non-heating mode
    (cool, dry, fan, auto). An optional pause toggle turns heating off and
    suspends the automation; an optional heating-season toggle disables it
    outside the season. Other heating (e.g. Nest / CV) is never touched.
  domain: automation
  source_url: https://github.com/koenhausmans/ha-automation-blueprints/blob/master/blueprints/climate/airco_heating_schedule.yaml
  input:
    climate_entity:
      name: Airco
      description: The airco climate entity. It must support the `heat` and `off` modes.
      selector:
        entity:
          domain: climate

    schedule_entity:
      name: Heating schedule
      description: >
        A Schedule helper (Settings → Devices & Services → Helpers → Schedule).
        Give every block additional data `profile: morning`, `profile: daytime`
        or `profile: evening`. Adjoining blocks with different profiles are fine.
        A block may also set `temperature: 21` and `threshold: 18` to override
        its profile values, and `presence_only: true` to heat only while someone
        is home.
      selector:
        entity:
          domain: schedule

    room_temp_sensor:
      name: Room temperature sensor (optional)
      description: >
        Indoor temperature sensor used for the start thresholds. Leave empty to
        always start at the beginning of a block. While the sensor is unknown or
        unavailable, blocks start as if the room were cold.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    morning_temp:
      name: Morning setpoint
      description: Target temperature for `morning` blocks.
      default: 20
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: °C
          mode: box

    morning_threshold:
      name: Morning start threshold
      description: >
        A `morning` block only starts heating while the room is below this
        temperature. 30 °C means always start.
      default: 30
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: °C
          mode: box

    daytime_temp:
      name: Daytime setpoint
      description: Target temperature for `daytime` blocks.
      default: 20
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: °C
          mode: box

    daytime_threshold:
      name: Daytime start threshold
      description: >
        A `daytime` block only starts heating while the room is below this
        temperature. 30 °C means always start.
      default: 30
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: °C
          mode: box

    evening_temp:
      name: Evening setpoint
      description: Target temperature for `evening` blocks.
      default: 20.5
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: °C
          mode: box

    evening_threshold:
      name: Evening start threshold
      description: >
        An `evening` block only starts heating while the room is below this
        temperature. 30 °C means always start.
      default: 30
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: °C
          mode: box

    presence_entities:
      name: People (optional)
      description: >
        Person entities for `presence_only` blocks and for extending heating
        after a block ends. Someone counts as home when their person is `home`.
        Leave empty to follow the schedule alone; `presence_only` blocks then
        never heat.
      default: []
      selector:
        entity:
          domain: person
          multiple: true

    away_grace:
      name: Departure grace period
      description: >
        How long everyone must be away before presence heating stops. Tolerates
        short Wi-Fi dropouts. Subtract any "consider home" delay already set on
        the device trackers so delays don't stack.
      default:
        minutes: 10
      selector:
        duration: {}

    presence_window_start:
      name: Presence heating from
      description: >
        Heating is only extended after a block between this time and "Presence
        heating until" (wraps past midnight). Set both to the same time to allow
        it all day.
      default: "07:00:00"
      selector:
        time: {}

    presence_window_end:
      name: Presence heating until
      default: "23:00:00"
      selector:
        time: {}

    pause_helper:
      name: Pause toggle (optional)
      description: >
        An input_boolean. Turning it on switches the airco off (if heating) and
        suspends the automation; turning it off resumes and re-applies the
        current schedule.
      default: ""
      selector:
        entity:
          domain: input_boolean

    season_helper:
      name: Heating season toggle (optional)
      description: >
        An input_boolean. While off, the automation does nothing; turning it off
        switches the airco off if it is heating. Leave empty to always be in season.
      default: ""
      selector:
        entity:
          domain: input_boolean

trigger_variables:
  t_schedule: !input schedule_entity
  t_room: !input room_temp_sensor
  t_th_morning: !input morning_threshold
  t_th_daytime: !input daytime_threshold
  t_th_evening: !input evening_threshold
  t_persons: !input presence_entities
  t_pause: !input pause_helper
  t_season: !input season_helper

triggers:
  - trigger: state
    entity_id: !input schedule_entity
    id: schedule
  # Fires when the room drops below the active block's threshold.
  - trigger: template
    value_template: >-
      {% set p = state_attr(t_schedule, 'profile') | default('', true) | string | lower %}
      {% set th = {'morning': t_th_morning, 'daytime': t_th_daytime,
                   'evening': t_th_evening}.get(p, -100) | float %}
      {{ t_room != '' and is_state(t_schedule, 'on')
         and states(t_room) | float(100) < state_attr(t_schedule, 'threshold') | float(th) }}
    id: room_cold
  - trigger: template
    value_template: >-
      {{ expand(t_persons) | selectattr('state', 'eq', 'home') | list | count > 0 }}
    id: arrive
  - trigger: template
    value_template: >-
      {{ t_persons | count > 0 and
         expand(t_persons) | selectattr('state', 'eq', 'home') | list | count == 0 }}
    for: !input away_grace
    id: leave
  - trigger: time
    at: !input presence_window_start
    id: window
  - trigger: time
    at: !input presence_window_end
    id: window
  - trigger: template
    value_template: "{{ t_pause != '' and is_state(t_pause, 'on') }}"
    id: pause_on
  - trigger: template
    value_template: "{{ t_pause != '' and is_state(t_pause, 'off') }}"
    id: pause_off
  - trigger: template
    value_template: "{{ t_season != '' and is_state(t_season, 'on') }}"
    id: season_on
  - trigger: template
    value_template: "{{ t_season != '' and is_state(t_season, 'off') }}"
    id: season_off
  - trigger: homeassistant
    event: start
    id: start

variables:
  climate_entity: !input climate_entity
  schedule_entity: !input schedule_entity
  room_temp_sensor: !input room_temp_sensor
  morning_temp: !input morning_temp
  daytime_temp: !input daytime_temp
  evening_temp: !input evening_temp
  morning_threshold: !input morning_threshold
  daytime_threshold: !input daytime_threshold
  evening_threshold: !input evening_threshold
  presence_entities: !input presence_entities
  away_grace: !input away_grace
  presence_window_start: !input presence_window_start
  presence_window_end: !input presence_window_end
  pause_helper: !input pause_helper
  season_helper: !input season_helper

conditions: []

actions:
  - variables:
      mode_now: "{{ states(climate_entity) }}"
      paused: "{{ pause_helper != '' and is_state(pause_helper, 'on') }}"
      in_season: "{{ season_helper == '' or not is_state(season_helper, 'off') }}"
      block_on: "{{ is_state(schedule_entity, 'on') }}"
      profile: "{{ state_attr(schedule_entity, 'profile') | default('', true) | string | lower }}"
      presence_only: >-
        {{ state_attr(schedule_entity, 'presence_only') | string | lower
           in ['true', 'yes', 'on', '1'] }}
      room_temp: >-
        {{ states(room_temp_sensor) | float(none) if room_temp_sensor != '' else none }}
      # The airco went off after the block started, so it was switched off by hand.
      # Pause off, season on and a restart re-apply the schedule regardless.
      manual_off: >-
        {% set c = states[climate_entity] %}
        {% set s = states[schedule_entity] %}
        {{ trigger.id not in ['pause_off', 'season_on', 'start']
           and c is not none and s is not none
           and c.state == 'off' and c.last_changed > s.last_changed }}
      grace_s: >-
        {% if away_grace is mapping %}
          {{ (away_grace.get('days', 0) | float(0)) * 86400
             + (away_grace.get('hours', 0) | float(0)) * 3600
             + (away_grace.get('minutes', 0) | float(0)) * 60
             + (away_grace.get('seconds', 0) | float(0)) }}
        {% else %}{{ 0 }}{% endif %}
      # A schedule trigger counts as a transition only when on/off or the block data changed.
      schedule_transition: >-
        {% if trigger.id == 'schedule' and trigger.from_state is not none
              and trigger.to_state is not none %}
          {% set a = trigger.from_state.attributes %}
          {% set b = trigger.to_state.attributes %}
          {{ trigger.from_state.state != trigger.to_state.state
             or a.get('profile') != b.get('profile')
             or a.get('temperature') != b.get('temperature')
             or a.get('threshold') != b.get('threshold')
             or a.get('presence_only') != b.get('presence_only') }}
        {% else %}false{% endif %}
  - variables:
      # Someone is home, or left less than the grace period ago. Unknown/unavailable never counts.
      someone_home: >-
        {% set ns = namespace(home=false) %}
        {% for p in expand(presence_entities) %}
          {% if p.state == 'home' %}
            {% set ns.home = true %}
          {% elif p.state not in ['unknown', 'unavailable']
                  and (now() - p.last_changed).total_seconds() < grace_s | float(0) %}
            {% set ns.home = true %}
          {% endif %}
        {% endfor %}
        {{ ns.home }}
      in_window: >-
        {% set s = presence_window_start[:5] %}
        {% set e = presence_window_end[:5] %}
        {% set n = now().strftime('%H:%M') %}
        {% if s == e %}true
        {% elif s < e %}{{ s <= n < e }}
        {% else %}{{ n >= s or n < e }}{% endif %}
      # Precedence: block `temperature` / `threshold` → blueprint input.
      setpoint: >-
        {% set fallback = {'morning': morning_temp, 'daytime': daytime_temp,
                           'evening': evening_temp}.get(profile, 0) | float %}
        {{ state_attr(schedule_entity, 'temperature') | float(fallback) }}
      threshold: >-
        {% set fallback = {'morning': morning_threshold, 'daytime': daytime_threshold,
                           'evening': evening_threshold}.get(profile, 0) | float %}
        {{ state_attr(schedule_entity, 'threshold') | float(fallback) }}
  - variables:
      # target: heat / off / invalid / none (leave alone)
      target: >-
        {% if block_on %}
          {% if profile not in ['morning', 'daytime', 'evening'] %}invalid
          {% elif presence_only and not someone_home %}off
          {% elif mode_now == 'heat' %}heat
          {% elif manual_off %}none
          {% elif room_temp is none or room_temp | float < threshold | float %}heat
          {% else %}none{% endif %}
        {% elif mode_now == 'heat' and someone_home and in_window %}heat
        {% else %}off{% endif %}
  - choose:
      # Pausing or leaving the season switches heating off, but never touches other modes.
      - conditions:
          - condition: template
            value_template: >-
              {{ (trigger.id == 'pause_on' or trigger.id == 'season_off')
                 and mode_now == 'heat' }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ climate_entity }}"
            data:
              hvac_mode: "off"
      - conditions:
          - condition: template
            value_template: >-
              {{ paused or not in_season or mode_now not in ['heat', 'off'] }}
        sequence: []
      - conditions:
          - condition: template
            value_template: "{{ target == 'invalid' }}"
        sequence:
          - action: logbook.log
            data:
              name: Airco heating schedule
              message: >-
                Ignored schedule block with unknown profile '{{ profile }}'
                (expected morning, daytime or evening).
              entity_id: "{{ schedule_entity }}"
      - conditions:
          - condition: template
            value_template: "{{ target == 'heat' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ mode_now != 'heat' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ climate_entity }}"
                data:
                  hvac_mode: heat
          # Only overwrite the setpoint in a block, on a transition or when heating
          # starts, so a manual adjustment lasts until the next block. Extending
          # after a block keeps the block's setpoint.
          - if:
              - condition: template
                value_template: >-
                  {{ block_on and (mode_now != 'heat' or schedule_transition)
                     and state_attr(climate_entity, 'temperature') | float(-1)
                         != setpoint | float }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ climate_entity }}"
                data:
                  temperature: "{{ setpoint | float }}"
      - conditions:
          - condition: template
            value_template: "{{ target == 'off' and mode_now == 'heat' }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ climate_entity }}"
            data:
              hvac_mode: "off"

mode: queued
max: 10
